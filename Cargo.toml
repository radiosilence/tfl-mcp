[workspace]
members = ["crates/tfl-api-client", "crates/tfl-mcp", "xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/radiosilence/tfl-mcp"

[workspace.dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
reqwest = { version = "0.13.5", default-features = false, features = [
  "json",
  "gzip",
  "query",
  "rustls",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["full"] }
tracing = "0.1.44"
url = "2.5"
percent-encoding = "2"

[profile.release]
strip = true
lto = "thin"
codegen-units = 16
