name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Releases whatever version is not yet released: how a failed release is
  # retried.
  workflow_dispatch:

# A pull request's newer push cancels its older run. Runs on main are never
# cancelled, since any of them may be publishing a release, and a manual run
# is in a group of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # radiosilence/tfl-mcp

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # --locked so a Cargo.lock left behind by a version bump fails here, with
      # an error that says so, rather than surfacing somewhere unrelated.
      # The live tests are `#[ignore]`d and stay that way here: they hit
      # api.tfl.gov.uk, which would make CI fail for TfL's outages and spend a
      # shared 50 requests/minute budget on every push.
      - run: cargo test --workspace --locked --verbose

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets -- -D warnings

  format:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
      # No rust-cache here on purpose: `cargo fmt --check` compiles nothing.
      - run: cargo fmt --all -- --check

  # CHANGELOG.md is generated from changelog.d/ (scripts/changelog.py). A pull
  # request adds fragments without regenerating it, so only its fragments and
  # the released versions are checked; one that writes CHANGELOG.md, as a
  # release does, must write exactly what the fragments make.
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - run: python3 -m unittest scripts/test_changelog.py
      - env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ] && git diff --name-only HEAD^1 HEAD | grep -qx CHANGELOG.md; then
            python3 scripts/changelog.py --check
          else
            python3 scripts/changelog.py --lint
          fi

  codegen:
    name: Generated client matches the spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # Branch-scoped caches aren't readable from other branches, so a PR
          # saving here only evicts the main entry every PR restores from.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Regenerates from the committed spec rather than fetching, so this fails
      # for hand-edits under generated/ and for generator changes that were not
      # re-run — not for TfL changing the document, which is a deliberate,
      # reviewable commit instead.
      - name: Regenerate
        run: TFL_SPEC_OFFLINE=1 cargo xtask regen
      # Scoped to the generated sources. Diffing the whole tree also catches
      # unrelated churn — a stale Cargo.lock, say — and reports it as a codegen
      # problem, sending you to re-run a generator that was never at fault.
      - name: Check for drift
        run: |
          if ! git diff --exit-code --stat -- crates/tfl-api-client/src/generated; then
            echo "::error::crates/tfl-api-client/src/generated is out of date. Run 'cargo xtask regen' and commit the result."
            exit 1
          fi

  check-version:
    name: Check Version
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      major: ${{ steps.check.outputs.major }}
      major_minor: ${{ steps.check.outputs.major_minor }}
      apple: ${{ steps.apple.outputs.apple }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 2
      # A push releases only when it changes the version. Comparing with the
      # latest GitHub release alone would let a push that lands while a release
      # is still running release the same version a second time. A manual run
      # releases whatever is unreleased. Pull requests never release, so this
      # only matters on main.
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
        run: |
          version_of() { sed -n 's/^version = "\(.*\)"/\1/p' | head -1; }
          CURRENT_VERSION=$(version_of < crates/tfl-mcp/Cargo.toml)
          PREVIOUS=$(git show HEAD^:crates/tfl-mcp/Cargo.toml 2>/dev/null | version_of || true)
          LATEST=$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || echo "")
          if [ "$CURRENT_VERSION" = "${LATEST#v}" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "workflow_dispatch" ] || [ "$CURRENT_VERSION" != "$PREVIOUS" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${CURRENT_VERSION}" >> $GITHUB_OUTPUT
          echo "major=$(echo $CURRENT_VERSION | cut -d. -f1)" >> $GITHUB_OUTPUT
          echo "major_minor=$(echo $CURRENT_VERSION | cut -d. -f1-2)" >> $GITHUB_OUTPUT
      # Whether a pull request changes anything Linux cannot check for macOS,
      # which decides whether it takes a macOS runner. HEAD^1 of a pull
      # request's merge commit is the base branch, so this is its whole diff.
      - id: apple
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -E '(^|/)(Cargo\.toml|Cargo\.lock|build\.rs)$|^\.cargo/|^rust-toolchain|^mise\.toml$|^\.github/workflows/'; then
            echo "apple=true" >> "$GITHUB_OUTPUT"
          else
            echo "apple=false" >> "$GITHUB_OUTPUT"
          fi

  # The only macOS job. The account's few macOS runners are shared by every
  # repository, and this crate has no platform-specific code, so Linux checks
  # the code on every pull request. A pull request takes a macOS runner only
  # when it changes what Linux cannot vouch for on macOS: the toolchain, the
  # dependencies (aws-lc-sys is a C build) or CI itself. On main it runs only
  # for a release, and then only builds, signs and packages the binary the
  # pull request already checked; the release job takes the tarball from here.
  # Apple silicon only; x86_64 macOS builds were dropped.
  macos:
    name: macOS aarch64
    needs: [check-version]
    if: >-
      (github.event_name == 'pull_request' && needs.check-version.outputs.apple == 'true') ||
      (github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.check-version.outputs.should_release == 'true')
    runs-on: macos-latest
    env:
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
          components: clippy
      # One target dir and one cache entry for clippy, the tests and the
      # release build.
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: aarch64-apple-darwin
          # Branch-scoped caches aren't readable from other branches, so a PR
          # saving here only evicts the main entry every PR restores from — and
          # a release target/ is the largest entry in the repository's 10GB.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        if: github.event_name == 'pull_request'
        run: cargo clippy --workspace --all-targets --locked --target "$TARGET" -- -D warnings
      - name: Test
        if: github.event_name == 'pull_request'
        run: cargo test --workspace --locked --target "$TARGET"
      - run: cargo build --release --locked -p tfl-mcp --target "$TARGET"
      # Developer ID signed and notarised, so the tarball runs from a browser
      # download without clearing quarantine. Pull requests stay ad-hoc signed.
      - name: Sign and notarise
        if: github.event_name != 'pull_request'
        uses: radiosilence/blit-workflows/macos-notarise@c8a650dfa5a0fbe012c61eab28f615c1983aee18
        with:
          binaries: |
            target/aarch64-apple-darwin/release/tfl
          certificate-p12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          certificate-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          api-key-p8: ${{ secrets.APPLE_API_KEY_P8 }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          api-issuer-id: ${{ secrets.APPLE_API_ISSUER_ID }}
      - name: Package
        if: github.event_name != 'pull_request'
        run: tar -czvf tfl-darwin-aarch64.tar.gz -C target/aarch64-apple-darwin/release tfl
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfl-darwin-aarch64
          path: tfl-darwin-aarch64.tar.gz

  # Compiles the musl binary and ships it straight into the image on the same
  # runner. Kept out of the macOS job so the image never waits on it; kept in one job so the binary never round-trips through the artifact
  # store, which would cost a runner handoff and drop its exec bit.
  # Runs on PRs too — only the registry push is main-gated, via PUBLISH.
  build-image:
    name: Build ${{ matrix.arch }} Image
    runs-on: ${{ matrix.runner }}
    needs: [check-version]
    strategy:
      # A transient registry timeout on one arch shouldn't cancel the other.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: linux-x86_64
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            name: linux-aarch64
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # musl-tools for the static target; cmake/clang for aws-lc-sys, the
      # rustls crypto backend, which is a C/C++ build.
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools musl-dev cmake clang

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.target }}
          # Branch-scoped caches aren't readable from other branches, so a PR
          # saving here only evicts the main entry every PR restores from — and
          # a release target/ is the largest entry in the repository's 10GB.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo build --release --locked -p tfl-mcp --target ${{ matrix.target }}

      # Same file feeds the image build and the release asset.
      - name: Prepare binary
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/tfl \
            dist/tfl-linux-${{ matrix.arch }}-musl

      # The image build below only needs dist/ as-is, so package the release
      # tarball into a separate dir rather than renaming anything in dist/.
      - name: Package
        run: |
          mkdir -p pkg
          cp dist/tfl-linux-${{ matrix.arch }}-musl pkg/tfl
          tar -czvf tfl-${{ matrix.name }}.tar.gz -C pkg tfl

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-${{ matrix.name }}
          path: tfl-${{ matrix.name }}.tar.gz

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Log in to Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On PRs this still builds — it just discards the result instead of
      # pushing, so a broken Dockerfile fails before merge rather than after.
      # No cache-from/cache-to: nothing compiles in the image, and mode=max was
      # filling the repo-wide 10GB cache that Swatinem/rust-cache shares.
      - name: Build ${{ matrix.arch }}
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-${{ matrix.arch }}

  create-manifest:
    name: Push image manifest
    needs: [test, lint, format, changelog, codegen, build-image, check-version]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create :main and :sha-<short> manifests
        run: |
          for tag in main "sha-$(echo ${{ github.sha }} | cut -c1-7)"; do
            docker buildx imagetools create \
              --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$tag \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-amd64 \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-arm64
          done
      - name: Create semver manifests
        if: needs.check-version.outputs.should_release == 'true'
        run: |
          for tag in "v${{ needs.check-version.outputs.version }}" \
                     "v${{ needs.check-version.outputs.major_minor }}" \
                     "v${{ needs.check-version.outputs.major }}" \
                     latest; do
            docker buildx imagetools create \
              --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$tag \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-amd64 \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-arm64
          done

  # Also needs the manifest: this project is consumed as a container, so a
  # version tag with no image behind it is worse than no tag at all — and an
  # auto-updater polling releases will happily pin one.
  #
  # Creates the tag through the API, on the commit that was built. The notes
  # are the version's section of CHANGELOG.md.
  create-release:
    name: Create Release
    needs:
      [test, lint, format, changelog, codegen, macos, build-image, check-version, create-manifest]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      # Release writes go through RELEASE_TOKEN: GitHub refuses the workflow
      # token's tag for a commit that changes a workflow.
      - name: Check the release token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN is not set; the release cannot be published"
            exit 1
          fi
      - name: Release notes
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          awk -v h="## $VERSION" '$0==h{f=1;next} f&&/^## /{exit} f' CHANGELOG.md > notes.md
          if ! grep -q . notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: v${{ needs.check-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.check-version.outputs.version }}
          body_path: notes.md
          files: artifacts/**/*.tar.gz
