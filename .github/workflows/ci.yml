name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # radiosilence/tfl-mcp

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # --locked so a Cargo.lock left behind by a version bump fails here, with
      # an error that says so, rather than surfacing somewhere unrelated.
      # The live tests are `#[ignore]`d and stay that way here: they hit
      # api.tfl.gov.uk, which would make CI fail for TfL's outages and spend a
      # shared 50 requests/minute budget on every push.
      - run: cargo test --workspace --locked --verbose

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets -- -D warnings

  format:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
      # No rust-cache here on purpose: `cargo fmt --check` compiles nothing.
      - run: cargo fmt --all -- --check

  codegen:
    name: Generated client matches the spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # Branch-scoped caches aren't readable from other branches, so a PR
          # saving here only evicts the main entry every PR restores from.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Regenerates from the committed spec rather than fetching, so this fails
      # for hand-edits under generated/ and for generator changes that were not
      # re-run — not for TfL changing the document, which is a deliberate,
      # reviewable commit instead.
      - name: Regenerate
        run: TFL_SPEC_OFFLINE=1 cargo xtask regen
      # Scoped to the generated sources. Diffing the whole tree also catches
      # unrelated churn — a stale Cargo.lock, say — and reports it as a codegen
      # problem, sending you to re-run a generator that was never at fault.
      - name: Check for drift
        run: |
          if ! git diff --exit-code --stat -- crates/tfl-api-client/src/generated; then
            echo "::error::crates/tfl-api-client/src/generated is out of date. Run 'cargo xtask regen' and commit the result."
            exit 1
          fi

  check-version:
    name: Check Version
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      major: ${{ steps.check.outputs.major }}
      major_minor: ${{ steps.check.outputs.major_minor }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_VERSION=$(grep '^version = ' crates/tfl-mcp/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          LATEST_RELEASE=$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || echo "")
          LATEST_VERSION=${LATEST_RELEASE#v}
          if [ -z "$LATEST_RELEASE" ] || [ "$CURRENT_VERSION" != "$LATEST_VERSION" ]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi
          echo "version=${CURRENT_VERSION}" >> $GITHUB_OUTPUT
          echo "major=$(echo $CURRENT_VERSION | cut -d. -f1)" >> $GITHUB_OUTPUT
          echo "major_minor=$(echo $CURRENT_VERSION | cut -d. -f1-2)" >> $GITHUB_OUTPUT

  # Runs on PRs too, so a broken build fails before merge. Only the release
  # asset (create-release) is gated to main.
  build-binaries:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            name: darwin-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: darwin-aarch64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.target }}
          # Branch-scoped caches aren't readable from other branches, so a PR
          # saving here only evicts the main entry every PR restores from — and
          # a release target/ is the largest entry in the repository's 10GB.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --release --locked -p tfl-mcp --target ${{ matrix.target }}
      # Developer ID signed and notarised, so the tarball runs from a browser
      # download without clearing quarantine. Pull requests stay ad-hoc signed.
      - name: Sign and notarise (macOS)
        if: runner.os == 'macOS' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event_name != 'schedule'
        uses: radiosilence/blit-workflows/macos-notarise@c8a650dfa5a0fbe012c61eab28f615c1983aee18
        with:
          binaries: |
            target/${{ matrix.target }}/release/tfl
          certificate-p12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          certificate-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          api-key-p8: ${{ secrets.APPLE_API_KEY_P8 }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          api-issuer-id: ${{ secrets.APPLE_API_ISSUER_ID }}
      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../tfl-${{ matrix.name }}.tar.gz tfl
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfl-${{ matrix.name }}
          path: tfl-${{ matrix.name }}.tar.gz

  # Compiles the musl binary and ships it straight into the image on the same
  # runner. Kept out of build-binaries so the image never waits on the macOS
  # legs; kept in one job so the binary never round-trips through the artifact
  # store, which would cost a runner handoff and drop its exec bit.
  # Runs on PRs too — only the registry push is main-gated, via PUBLISH.
  build-image:
    name: Build ${{ matrix.arch }} Image
    runs-on: ${{ matrix.runner }}
    needs: [check-version]
    strategy:
      # A transient registry timeout on one arch shouldn't cancel the other.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: linux-x86_64
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            name: linux-aarch64
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # musl-tools for the static target; cmake/clang for aws-lc-sys, the
      # rustls crypto backend, which is a C/C++ build.
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools musl-dev cmake clang

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.target }}
          # Branch-scoped caches aren't readable from other branches, so a PR
          # saving here only evicts the main entry every PR restores from — and
          # a release target/ is the largest entry in the repository's 10GB.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo build --release --locked -p tfl-mcp --target ${{ matrix.target }}

      # Same file feeds the image build and the release asset.
      - name: Prepare binary
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/tfl \
            dist/tfl-linux-${{ matrix.arch }}-musl

      # The image build below only needs dist/ as-is, so package the release
      # tarball into a separate dir rather than renaming anything in dist/.
      - name: Package
        run: |
          mkdir -p pkg
          cp dist/tfl-linux-${{ matrix.arch }}-musl pkg/tfl
          tar -czvf tfl-${{ matrix.name }}.tar.gz -C pkg tfl

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-${{ matrix.name }}
          path: tfl-${{ matrix.name }}.tar.gz

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Log in to Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On PRs this still builds — it just discards the result instead of
      # pushing, so a broken Dockerfile fails before merge rather than after.
      # No cache-from/cache-to: nothing compiles in the image, and mode=max was
      # filling the repo-wide 10GB cache that Swatinem/rust-cache shares.
      - name: Build ${{ matrix.arch }}
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-${{ matrix.arch }}

  create-manifest:
    name: Push image manifest
    needs: [test, lint, format, codegen, build-image, check-version]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create :main and :sha-<short> manifests
        run: |
          for tag in main "sha-$(echo ${{ github.sha }} | cut -c1-7)"; do
            docker buildx imagetools create \
              --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$tag \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-amd64 \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-arm64
          done
      - name: Create semver manifests
        if: needs.check-version.outputs.should_release == 'true'
        run: |
          for tag in "v${{ needs.check-version.outputs.version }}" \
                     "v${{ needs.check-version.outputs.major_minor }}" \
                     "v${{ needs.check-version.outputs.major }}" \
                     latest; do
            docker buildx imagetools create \
              --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$tag \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-amd64 \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-arm64
          done

  # Also needs the manifest: this project is consumed as a container, so a
  # version tag with no image behind it is worse than no tag at all — and an
  # auto-updater polling releases will happily pin one.
  create-release:
    name: Create Release
    needs:
      [test, lint, format, codegen, build-binaries, build-image, check-version, create-manifest]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: v${{ needs.check-version.outputs.version }}
          files: artifacts/**/*.tar.gz
          generate_release_notes: true
