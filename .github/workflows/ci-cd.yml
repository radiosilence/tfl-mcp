name: CI/CD

# Two halves in one run, so the second ships what the first built.
#
# CI checks the change and ends in `Checks`, the one status a ruleset
# should require. Each job runs only for the domains the change touches (see
# `changes`); a skipped job passes `Checks`, a failed or cancelled one fails
# it. Jobs can therefore be added, renamed or skipped without touching branch
# protection.
#
# CD runs after `Checks` has passed on main. Every push that changes the image
# moves its `main` tag; a push that changes the version also releases: the
# image's version tags, then the GitHub release with the binaries. CD ships
# what CI built: the Linux binaries (`linux-build`), which are also what the
# image holds. The macOS release build, which CI has no use for, starts
# alongside the checks rather than after them; nothing is published until
# both have passed.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Releases whatever version is not yet released: how a failed release is
  # retried.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/radiosilence/tfl-mcp

# A pull request's newer push cancels its older run; on main, a newer push
# cancels an older one that releases nothing. A run that may release is in a
# group of its own and is never cancelled, nor is a manual run, which is how a
# failed release is retried. The group is chosen before any job runs, so it
# cannot ask `changes`: a push may release when its head commit is titled
# `release: ` (as `just release` names its pull request) or changes the
# server's Cargo.toml, which carries the version.
concurrency:
  group: "ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || (startsWith(github.event.head_commit.message, 'release: ') || contains(github.event.head_commit.modified, 'crates/tfl-mcp/Cargo.toml')) && format('release-{0}', github.sha) || 'main' }}"
  cancel-in-progress: "${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'release: ') && !contains(github.event.head_commit.modified, 'crates/tfl-mcp/Cargo.toml')) }}"

jobs:
  # ── CI ──────────────────────────────────────────────────────────────────

  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      codegen: ${{ steps.filter.outputs.codegen }}
      apple: ${{ steps.filter.outputs.apple }}
      docker: ${{ steps.filter.outputs.docker }}
      release: ${{ steps.filter.outputs.release }}
      version: ${{ steps.filter.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        # The domains a change touches, from its diff. A pull request's is
        # against its base. A push's is against the last commit on main whose
        # run passed, so a push whose run was cancelled by the next one still
        # reaches CD with it. A manual run, a push with no passed commit
        # within reach, or a diff that cannot be worked out, runs everything.
        #
        # Allowlists, so the question is "did any source of this domain
        # change?" rather than "was everything recognisably irrelevant?". The
        # cost is that a new top-level directory of code is invisible here
        # until it is added below. Markdown is documentation wherever it sits.
        # justfile and mise.toml are absent on purpose: no job here reads them.
        #
        # Steps run under `bash -e`, where grep finding nothing is a failing
        # command rather than an answer, so every question is asked in a
        # condition.
        run: |
          rust=true codegen=true apple=true docker=true release=false
          version_of() { sed -n 's/^version = "\(.*\)"/\1/p' | head -1; }
          # A pull request merged or closed as its run was created: the
          # cancelling workflow can look before this run is listed, and the
          # run would otherwise hold runners for a change that is already in.
          # Unanswered, it counts as open.
          state=OPEN
          if [ "$EVENT" = "pull_request" ]; then
            state=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state --jq .state 2>/dev/null || echo OPEN)
          fi
          # Empty when it cannot be found: then everything runs, since a
          # narrower diff could leave a cancelled push's changes undelivered.
          base=HEAD^1
          if [ "$EVENT" = "push" ]; then
            base=
            passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci-cd.yml --branch main --event push \
              --status success --limit 1 --json headSha --jq '.[0].headSha // empty' || true)
            if [ "$passed" = "$(git rev-parse HEAD)" ]; then
              base=HEAD^1
            elif [ -n "$passed" ] && git fetch -q --deepen=200 origin main && git merge-base --is-ancestor "$passed" HEAD; then
              base=$passed
            else
              echo "::notice::no passed run on main within reach -- running everything"
            fi
          fi
          # Whether this run releases, the one answer every release job reads,
          # worked out apart from the diff. A pull request: a release PR
          # (branch `release-v*`, or a version change), which runs everything
          # and publishes nothing. On main: a push whose commit changes the
          # version (against HEAD^1, not the diff base, so a push landing
          # while a release runs cannot release it again), or a manual run,
          # when that version is not out yet. Only a 404
          # means it is not; any other answer fails here, since guessing
          # either way would release twice or never. Nothing off main
          # releases.
          version=$(version_of < crates/tfl-mcp/Cargo.toml)
          bumped=false
          if [ "$(git show HEAD^1:crates/tfl-mcp/Cargo.toml 2>/dev/null | version_of)" != "$version" ]; then
            bumped=true
          fi
          if [ "$EVENT" = "pull_request" ]; then
            case "$HEAD_REF" in release-v*) bumped=true ;; esac
            release=$bumped
          elif [ "$GITHUB_REF" = refs/heads/main ] && { [ "$EVENT" = workflow_dispatch ] || [ "$bumped" = true ]; }; then
            if out=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$version" 2>&1 > /dev/null); then
              echo "v$version is already released"
            elif printf '%s' "$out" | grep -q 'HTTP 404'; then
              release=true
            else
              echo "::error::could not tell whether v$version is released: $out"
              exit 1
            fi
          fi
          touches() { printf '%s\n' "$files" | grep -E "$1" | grep -qvE '\.md$'; }
          if [ "$state" != "OPEN" ]; then
            echo "pull request #$PR is no longer open -- skipping everything"
            rust=false codegen=false apple=false docker=false release=false
          elif [ "$EVENT" != "workflow_dispatch" ] && [ -n "$base" ] && files=$(git diff --name-only "$base" HEAD); then
            echo "changes since $(git rev-parse --short "$base"):"
            printf '%s\n' "$files" | sed 's/^/  /'
            # Cargo.lock counts for the generator, and for the native builds
            # (macOS, musl), only when the change reaches them. Unanswerable,
            # it counts.
            lock=$(python3 .github/scripts/lock_inputs.py "$base" HEAD) || lock=$'codegen=true\nnative=true\nserver=true'
            eval "$(printf '%s\n' "$lock" | sed 's/^/lock_/')"

            # Anything cargo compiles or that decides how, and the formatter's
            # and linter's settings. The server's tests read the spec under
            # codegen/ with include_str!.
            touches '^crates/|^xtask/|^codegen/|^Cargo\.(toml|lock)$|^\.cargo/|^rust-toolchain|^\.?(rustfmt|clippy)\.toml$|^\.github/' || rust=false
            # The generated client is a function of the generator, the spec,
            # the toolchain and rustfmt's settings, since the generator formats
            # its output; a hand-edit under generated/ also shows here.
            if [ "$lock_codegen" != true ]; then
              touches '^crates/tfl-api-client/|^xtask/|^codegen/|^Cargo\.toml$|^\.cargo/|^rust-toolchain|^\.?rustfmt\.toml$|^\.github/' || codegen=false
            fi
            # The macOS runners are few and shared by every repository. The
            # code has no macOS-only paths, so the Linux jobs cover a source
            # change; what they cannot see is a native input changing (a
            # dependency, manifest, build script or the toolchain: aws-lc-sys
            # is a C build), or code added next to a cfg for an Apple target.
            native=false
            if [ "$lock_native" = true ] || touches '(^|/)Cargo\.toml$|(^|/)build\.rs$|^\.cargo/|^rust-toolchain|^\.github/'; then
              native=true
            fi
            apple=false
            if [ "$release" = true ] || [ "$native" = true ]; then
              apple=true
            elif git diff -U20 "$base" HEAD -- '*.rs' '*.toml' \
              | grep -E '^[ +-]' | grep -qE 'target_os = "(macos|ios)"|target_vendor = "apple"'; then
              apple=true
            fi
            # The image is the static musl binaries copied into it. The Rust
            # jobs already check the code, so a pull request builds them and
            # the image only when the recipe or a native input of the server
            # changed (xtask's are not in it); main whenever what they contain
            # did, since CD ships them.
            if [ "$EVENT" = "pull_request" ] || [ "$rust" = false ]; then
              [ "$lock_server" = true ] \
                || touches '^Dockerfile$|^Cargo\.toml$|^crates/[^/]+/Cargo\.toml$|^crates/.*build\.rs$|^\.cargo/|^rust-toolchain|^\.github/' \
                || docker=false
            fi
          fi
          # A release PR runs everything; a release ships the image.
          if [ "$release" = true ]; then
            docker=true
            if [ "$EVENT" = "pull_request" ]; then
              rust=true codegen=true apple=true
            fi
          fi
          {
            echo "rust=$rust"
            echo "codegen=$codegen"
            echo "apple=$apple"
            echo "docker=$docker"
            echo "release=$release"
            echo "version=$version"
          } | tee -a "$GITHUB_OUTPUT"

  # GitHub has no priority among its runners, and the account's few macOS
  # ones are what a release waits on. A release cancels this repository's
  # pull request runs, which are re-run from their page or by the next push,
  # and main's earlier non-release runs, which a newer one supersedes. At the
  # start rather than in CD, so the release builds that start alongside the
  # checks find the runners free. A job of its own, so only it holds a token
  # that can cancel runs.
  make-room:
    name: Make room for the release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.changes.outputs.release == 'true'
    permissions:
      actions: write
      contents: read
    steps:
      # Only runs older than this one, and on main only those the workflow's
      # concurrency would also cancel: never one whose commit is titled
      # `release: ` or changes the server's Cargo.toml, which may release.
      # Best effort: the release builds need this job, so nothing here fails
      # it, and a commit whose files cannot be listed is left alone.
      - env:
          GH_TOKEN: ${{ github.token }}
          SELF: ${{ github.run_id }}
        run: |
          for status in requested queued pending waiting in_progress; do
            gh run list --repo "$GITHUB_REPOSITORY" --workflow ci-cd.yml --status "$status" --limit 100 \
              --json databaseId,event,headBranch,headSha,displayTitle \
              --jq ".[] | select(.databaseId < $SELF) | select(.event == \"pull_request\" or (.event == \"push\" and .headBranch == \"main\" and (.displayTitle | startswith(\"release: \") | not))) | \"\\(.databaseId) \\(.event) \\(.headSha)\"" || true
          done | sort -u | while read -r id event sha; do
            if [ "$event" = push ]; then
              files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$sha" --jq '.files[].filename' || echo crates/tfl-mcp/Cargo.toml)
              printf '%s\n' "$files" | grep -qx crates/tfl-mcp/Cargo.toml && continue
            fi
            echo "cancelling run $id"
            gh run cancel "$id" --repo "$GITHUB_REPOSITORY" || true
          done

  fmt:
    name: Format
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 10
    # A newer push cancels a PR's checks. On main the group is the run's own,
    # so only the workflow's concurrency decides, and it never cancels a run
    # that may release.
    concurrency:
      group: fmt-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No Rust cache: formatting compiles nothing.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  # CHANGELOG.md is generated from changelog.d/ (scripts/changelog.py). A pull
  # request adds fragments without regenerating it, so only its fragments and
  # the released versions are checked; one that writes CHANGELOG.md, as a
  # release does, must write exactly what the fragments make.
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - run: python3 -m unittest scripts/test_changelog.py
      - env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ] && git diff --name-only HEAD^1 HEAD | grep -qx CHANGELOG.md; then
            python3 scripts/changelog.py --check
          else
            python3 scripts/changelog.py --lint
          fi

  # Clippy and the tests on one runner, with one target directory and one
  # cache, since they share build scripts and proc-macros. The tests run
  # however clippy went, so one push reports every failure; neither runs
  # after a failed setup step.
  linux:
    name: Linux
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 45
    concurrency:
      group: linux-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          components: clippy
      - id: cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Branch-scoped caches aren't readable from other branches, so a PR
          # saving here only evicts the main entry every PR restores from.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: linux
          # A failing check would otherwise leave the cache unsaved.
          cache-on-failure: true
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # --locked so a Cargo.lock left behind by a version bump fails here, with
      # an error that says so, rather than surfacing somewhere unrelated.
      # The live tests are `#[ignore]`d and stay that way here: they hit
      # api.tfl.gov.uk, which would make CI fail for TfL's outages and spend a
      # shared 50 requests/minute budget on every push.
      - if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        run: cargo test --workspace --locked

  codegen:
    name: Generated client matches the spec
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.codegen == 'true'
    timeout-minutes: 20
    concurrency:
      group: codegen-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: codegen
          cache-on-failure: true
      # Regenerates from the committed spec rather than fetching, so this fails
      # for hand-edits under generated/ and for generator changes that were not
      # re-run, not for TfL changing the document, which is a deliberate,
      # reviewable commit instead.
      - name: Regenerate
        run: TFL_SPEC_OFFLINE=1 cargo xtask regen
      # Scoped to the generated sources. Diffing the whole tree also catches
      # unrelated churn (a stale Cargo.lock, say) and reports it as a codegen
      # problem, sending you to re-run a generator that was never at fault.
      - name: Check for drift
        run: |
          if ! git diff --exit-code --stat -- crates/tfl-api-client/src/generated; then
            echo "::error::crates/tfl-api-client/src/generated is out of date. Run 'cargo xtask regen' and commit the result."
            exit 1
          fi

  # The tests on macOS, for what the Linux jobs cannot see (see `changes`).
  # The account's macOS runners are few and shared by every repository, so
  # this is one job, in the dev profile; a release PR also builds both darwin
  # targets as the release will, unsigned. A release push is not checked
  # again: its pull request was. The release build belongs to
  # `macos-release`.
  apple:
    name: macOS
    runs-on: macos-latest
    needs: changes
    if: needs.changes.outputs.apple == 'true' && !(github.event_name != 'pull_request' && needs.changes.outputs.release == 'true')
    timeout-minutes: 45
    concurrency:
      group: apple-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - id: cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: apple
          cache-on-failure: true
      - run: cargo test --workspace --locked
      - if: ${{ !cancelled() && steps.cache.outcome == 'success' && needs.changes.outputs.release == 'true' }}
        run: |
          cargo build --release --locked -p tfl-mcp --target x86_64-apple-darwin
          cargo build --release --locked -p tfl-mcp --target aarch64-apple-darwin

  # The Linux binaries, in release, once: the image is built from them and a
  # release attaches them. Static musl builds on the runners, each on its own
  # architecture, with the Rust cache, rather than inside Docker.
  linux-build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    needs: [changes, make-room]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.docker == 'true' }}
    timeout-minutes: 45
    concurrency:
      group: linux-build-${{ matrix.name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned, so a runner image change cannot change the release build
          # unannounced. The binaries are static, so the image's base has no
          # libc to match.
          - name: tfl-linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - name: tfl-linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # musl-tools for the static target; cmake/clang for aws-lc-sys, the
      # rustls crypto backend, which is a C/C++ build.
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools musl-dev cmake clang
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: ${{ matrix.name }}
          cache-on-failure: true
      # Tarred, because an artifact does not keep the executable bit; the
      # tarball is the release's download as it stands.
      - run: |
          cargo build --release --locked -p tfl-mcp --target ${{ matrix.target }}
          tar czf "${{ matrix.name }}.tar.gz" -C target/${{ matrix.target }}/release tfl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.tar.gz
          retention-days: ${{ github.event_name != 'pull_request' && needs.changes.outputs.release == 'true' && 90 || 7 }}

  # The binaries above in the image, for both architectures. A pull request
  # builds it to prove it builds. Main pushes it under the commit, in parallel
  # with the checks: nothing deploys a commit tag, and CD moves `main`, and a
  # release's version tags and `latest`, onto it only once `Checks` has passed.
  # The Dockerfile only copies files, so no emulation and no layer cache.
  container:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, linux-build]
    if: ${{ !cancelled() && needs.linux-build.result == 'success' }}
    concurrency:
      group: container-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tfl-linux-*
      - run: |
          mkdir -p dist/amd64 dist/arm64
          tar xzf tfl-linux-x86_64/tfl-linux-x86_64.tar.gz -C dist/amd64
          tar xzf tfl-linux-aarch64/tfl-linux-aarch64.tar.gz -C dist/arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # The build record would be uploaded as an artifact of this run,
          # beside the ones a release attaches.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: dist
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}

  # The one status the ruleset requires. Skipped jobs are domains the change
  # does not touch and pass; anything failed or cancelled fails it.
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, fmt, changelog, linux, codegen, apple, linux-build, container]
    if: always()
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key')
          if [ -n "$bad" ]; then
            echo "::error::not passed: $(echo "$bad" | paste -sd ' ' -)"
            exit 1
          fi

  # ── CD ──────────────────────────────────────────────────────────────────
  #
  # Main only, after `Checks`. `checks` runs whatever its needs did, so every
  # job here states the results it depends on rather than relying on the
  # default, which would skip it whenever any job upstream was skipped.

  check-version:
    name: Check Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, checks]
    if: ${{ !cancelled() && needs.checks.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    outputs:
      should_release: ${{ needs.changes.outputs.release }}
      version: ${{ needs.changes.outputs.version }}
      major: ${{ steps.parts.outputs.major }}
      major_minor: ${{ steps.parts.outputs.major_minor }}
    steps:
      - id: parts
        env:
          VERSION: ${{ needs.changes.outputs.version }}
        run: |
          echo "major=$(echo "$VERSION" | cut -d. -f1)" >> "$GITHUB_OUTPUT"
          echo "major_minor=$(echo "$VERSION" | cut -d. -f1-2)" >> "$GITHUB_OUTPUT"

  # `sha-<short>` names this commit's image once its checks have passed, and
  # `main` follows the newest such commit. Retagging needs no rebuild.
  container-main:
    name: Container image (main)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [container, check-version]
    if: ${{ !cancelled() && needs.container.result == 'success' && needs.check-version.result == 'success' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker buildx imagetools create -t "$IMAGE:sha-${GITHUB_SHA::7}" "$IMAGE:$GITHUB_SHA"
      # A release run is never cancelled and can finish after a later push's
      # run, so `main` moves only forward: to this commit when it descends
      # from the one the tag holds now (its revision label). Main's head is no
      # guide, since a later push that builds no image moves it without
      # retagging.
      #
      # Only a missing tag or label, or a labelled commit GitHub no longer
      # knows (history rewritten), means "move"; any other failure to read
      # either fails the step rather than guess.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if inspect=$(docker buildx imagetools inspect "$IMAGE:main" --format '{{json .Image}}' 2>&1); then
            current=$(printf '%s' "$inspect" \
              | jq -r '[.. | objects | .config.Labels?["org.opencontainers.image.revision"]? // empty][0] // empty')
          elif printf '%s' "$inspect" | grep -qiE 'not found|manifest unknown'; then
            current=
          else
            echo "::error::cannot read $IMAGE:main: $inspect"
            exit 1
          fi
          if [ -n "$current" ] && [ "$current" != "$GITHUB_SHA" ]; then
            if status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$current...$GITHUB_SHA" --jq .status 2>&1); then
              if [ "$status" != ahead ]; then
                echo "::notice::main holds $current, which this commit does not descend from ($status); leaving it"
                exit 0
              fi
            elif printf '%s' "$status" | grep -q 'HTTP 404'; then
              echo "::notice::main holds $current, which no longer exists; moving it"
            else
              echo "::error::cannot compare $current with this commit: $status"
              exit 1
            fi
          fi
          docker buildx imagetools create -t "$IMAGE:main" "$IMAGE:$GITHUB_SHA"

  # The macOS binaries in release, Developer ID signed and notarised, so the
  # tarballs run from a browser download without clearing quarantine. One
  # runner for both architectures: the account's macOS runners are few.
  #
  # Started by `changes` rather than after `Checks`: it is the longest job in a
  # release and publishes nothing, so it builds while the checks run, and the
  # publishing waits for both.
  macos-release:
    name: Release (macOS)
    runs-on: macos-latest
    timeout-minutes: 90
    needs: [changes, make-room]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.release == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: macos-release
      - run: |
          cargo build --release --locked -p tfl-mcp --target x86_64-apple-darwin
          cargo build --release --locked -p tfl-mcp --target aarch64-apple-darwin
      # One call per binary: the action gathers what it signs by file name,
      # and both are `tfl`. It fails if any signing secret is missing, so a
      # release cannot ship unsigned.
      - name: Sign and notarise (x86_64)
        uses: radiosilence/blit-workflows/macos-notarise@c8a650dfa5a0fbe012c61eab28f615c1983aee18
        with:
          binaries: target/x86_64-apple-darwin/release/tfl
          certificate-p12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          certificate-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          api-key-p8: ${{ secrets.APPLE_API_KEY_P8 }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          api-issuer-id: ${{ secrets.APPLE_API_ISSUER_ID }}
      - name: Sign and notarise (aarch64)
        uses: radiosilence/blit-workflows/macos-notarise@c8a650dfa5a0fbe012c61eab28f615c1983aee18
        with:
          binaries: target/aarch64-apple-darwin/release/tfl
          certificate-p12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          certificate-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          api-key-p8: ${{ secrets.APPLE_API_KEY_P8 }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          api-issuer-id: ${{ secrets.APPLE_API_ISSUER_ID }}
      - run: |
          tar czf tfl-darwin-x86_64.tar.gz -C target/x86_64-apple-darwin/release tfl
          tar czf tfl-darwin-aarch64.tar.gz -C target/aarch64-apple-darwin/release tfl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfl-darwin-x86_64
          path: tfl-darwin-x86_64.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfl-darwin-aarch64
          path: tfl-darwin-aarch64.tar.gz

  # The image this commit already pushed, tagged with the release's version
  # and `latest` once the release's builds have passed: a failed release must
  # not move `latest`. Retagging needs no rebuild, and repeats safely.
  container-release:
    name: Container image (release tags)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [check-version, container, macos-release]
    if: ${{ !cancelled() && needs.check-version.outputs.should_release == 'true' && needs.container.result == 'success' && needs.macos-release.result == 'success' }}
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
      MAJOR_MINOR: ${{ needs.check-version.outputs.major_minor }}
      MAJOR: ${{ needs.check-version.outputs.major }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker buildx imagetools create \
            -t "$IMAGE:v$VERSION" -t "$IMAGE:v$MAJOR_MINOR" -t "$IMAGE:v$MAJOR" -t "$IMAGE:latest" \
            "$IMAGE:$GITHUB_SHA"

  # After the image's version tags: this project is consumed as a container,
  # and jaritanet pins `vX.Y.Z` as soon as the release exists, so a release
  # with no image behind it is worse than no release at all.
  #
  # Creates the tag through the API, on the commit that was built. The notes
  # are the version's section of CHANGELOG.md.
  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [check-version, linux-build, macos-release, container-release]
    # Every need having run, not merely not failed: a skipped job is not a
    # failure, and a release without one of its parts is not a release.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') && needs.check-version.outputs.should_release == 'true' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Release writes go through RELEASE_TOKEN: GitHub refuses the workflow
      # token's tag for a commit that changes a workflow.
      - name: Check the release token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN is not set; the release cannot be published"
            exit 1
          fi
      - name: Release notes
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          awk -v h="## $VERSION" '$0==h{f=1;next} f&&/^## /{exit} f' CHANGELOG.md > notes.md
          if ! grep -q . notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: tfl-*
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: v${{ needs.check-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.check-version.outputs.version }}
          body_path: notes.md
          files: artifacts/**/*.tar.gz
